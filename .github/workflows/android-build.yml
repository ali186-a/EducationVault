name: Android Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # needed only to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Check app configuration
        run: |
          if grep -v '^[[:space:]]*#' app-config.properties | grep -q 'REPLACE_ME'; then
            echo "::warning title=App not configured::app-config.properties still contains REPLACE_ME placeholders. The APK will build, but it will show a configuration error screen and will NOT connect to any backend."
          else
            echo "app-config.properties contains no placeholders."
          fi

      - name: Unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug -PversionCode=${{ github.run_number }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EducationVault-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # A permanent download page: https://github.com/<you>/<repo>/releases/latest
      # (failure here never fails the build; the APK is still in the artifact above)
      - name: Publish APK as a GitHub Release
        if: github.ref_name == github.event.repository.default_branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk EducationVault.apk
          gh release create "build-${{ github.run_number }}" EducationVault.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "${NOTES:-Automatic build}" \
            --target "${{ github.sha }}" --latest

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/
          if-no-files-found: ignore
